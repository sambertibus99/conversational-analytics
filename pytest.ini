[pytest]
# Pytest Konfiguration für Conversational Analytics
# WICHTIG: Nutze run_tests.py um ROS-Plugin-Konflikte zu vermeiden!

# Test-Verzeichnis
testpaths = tests

# Python-Dateien die als Tests erkannt werden
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async-Mode für pytest-asyncio
asyncio_mode = auto

# Standard-Optionen
addopts = -v --tb=short

# Marker
markers =
    integration: Tests die ThingsBoard-Verbindung brauchen
    slow: Langsame Tests (LLM-Aufrufe)

# Warnungen ignorieren
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
