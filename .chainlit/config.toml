[project]
# Ob die Telemetrie aktiviert ist (für Chainlit Cloud)
enable_telemetry = false

# Session-Timeout in Sekunden
session_timeout = 3600

# Cache aktivieren
cache = false

[features]
# Prompt Playground Feature
prompt_playground = false

# HTML in Nachrichten erlauben
unsafe_allow_html = false

# LaTeX Rendering
latex = false

# Multi-Modal Upload
multi_modal = true

# Spontaneous File Upload - muss ein Dict sein in neueren Versionen
[features.spontaneous_file_upload]
enabled = false

[UI]
# Name der App
name = "IIoT Analytics"

# App-Beschreibung
description = "Conversational Analytics für IIoT-Daten"

# Theme
default_theme = "light"

# Ob der Chain-of-Thought angezeigt wird
show_readme_as_default = true

[meta]
# Meta-Tags für SEO
generated_by = "Conversational Analytics MA"
